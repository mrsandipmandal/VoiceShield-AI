name: VoiceShield AI — Build, Sign & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Publish a GitHub Release from this workflow run"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Tag name if publishing a manual release (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  KEY_ALIAS: "upload"
  KEYSTORE_FILE_NAME: "my-upload-key.jks"

jobs:
  test:
    name: Unit & Robolectric Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment File (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Local JVM & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceshield-ai-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  build-and-release:
    name: Build & Sign Debug / Release APKs
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/${{ env.KEYSTORE_FILE_NAME }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'voiceshield2026' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'voiceshield2026' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment Variables (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Provision Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from RELEASE_KEYSTORE_BASE64 secret into $KEYSTORE_PATH..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          elif [ ! -f "$KEYSTORE_PATH" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret provided; generating RSA-2048 release keystore at $KEYSTORE_PATH..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VoiceShield AI, OU=Mobile Security, O=VoiceShield, L=Kolkata, ST=WB, C=IN"
          fi
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name:|Owner:|SHA1:|SHA256:" || true

      - name: Clean Legacy Duplicate Launcher Mipmaps
        run: |
          for dir in app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi; do
            if [ -f "$dir/ic_launcher.png" ] && [ -f "$dir/ic_launcher.webp" ]; then
              rm -f "$dir/ic_launcher.webp"
            fi
            if [ -f "$dir/ic_launcher_round.png" ] && [ -f "$dir/ic_launcher_round.webp" ]; then
              rm -f "$dir/ic_launcher_round.webp"
            fi
          done

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Signed Release APK & App Bundle (AAB)
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Prepare Versioned Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoiceShield-AI-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/VoiceShield-AI-release-signed.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab dist/VoiceShield-AI-release-signed.aab
          fi
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceshield-ai-debug-apk
          path: dist/VoiceShield-AI-debug.apk
          retention-days: 30

      - name: Upload Signed Release APK & Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceshield-ai-release-apk
          path: |
            dist/VoiceShield-AI-release-signed.apk
            dist/SHA256SUMS.txt
          retention-days: 90

      - name: Upload Signed Release App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceshield-ai-release-aab
          path: dist/VoiceShield-AI-release-signed.aab
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: "VoiceShield AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          generate_release_notes: true
          files: |
            dist/VoiceShield-AI-release-signed.apk
            dist/VoiceShield-AI-debug.apk
            dist/VoiceShield-AI-release-signed.aab
            dist/SHA256SUMS.txt
